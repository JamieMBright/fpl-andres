<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="FPL Andres turns public Fantasy Premier League data into evidence-labelled decisions."
    />
    <meta name="theme-color" content="#16123a" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- Square. iOS crops a non-square touch icon to fit, and favicon.svg is
         260x200, so the hat lost its brim on every home screen. -->
    <link rel="apple-touch-icon" href="/icon-512.svg" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta property="og:title" content="FPL Andres" />
    <meta
      property="og:description"
      content="Evidence-labelled Fantasy Premier League decisions."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:site" content="@fpl_andres" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=Newsreader:opsz,wght@6..72,500;6..72,650&amp;family=Space+Grotesk:wght@500;700&amp;display=swap"
      rel="stylesheet"
    />
    <title>FPL Andres</title>
    <!--
      Structured data, so a search result describes the site
      rather than guessing from the first paragraph it finds.

      Deliberately only what is true of every page. This is a single-page app,
      so the document head is the same on every route; per-route breadcrumbs
      would have to be injected at runtime, which means a search crawler that
      does not execute JavaScript would read the home page's breadcrumb on
      every URL. Wrong structured data is worse than none, because it is
      trusted.

      No `aggregateRating`, no `Review`, no `Organization` with a fake address.
      Every property below is checkable against the page it describes.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://fpl-andres.vercel.app/#website",
            "name": "FPL Andres",
            "description": "Evidence-labelled Fantasy Premier League decisions from public data.",
            "inLanguage": "en-GB",
            "isFamilyFriendly": true
          },
          {
            "@type": "WebApplication",
            "name": "FPL Andres",
            "applicationCategory": "SportsApplication",
            "operatingSystem": "Any browser",
            "browserRequirements": "Requires JavaScript.",
            "isAccessibleForFree": true,
            "offers": {
              "@type": "Offer",
              "price": "0",
              "priceCurrency": "GBP"
            },
            "isPartOf": { "@id": "https://fpl-andres.vercel.app/#website" }
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
