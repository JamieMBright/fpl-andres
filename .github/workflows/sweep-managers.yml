name: Manager sweep

# The register was swept to id 2,500,001 and stopped. FPL is past thirteen
# million players, so more than four fifths of the ids have never been looked
# at, and every manager who registered since is invisible to FPL500.
#
# It cannot run in one go: eleven and a half million ids at the rate this
# sweep holds itself to is the better part of a week, and a job here is capped
# at six hours. So each run takes a bounded bite and writes its position, and
# the next run picks it up. The checkpoint is the whole design.
#
# Egress matters. FPL refuses the Vercel deployment intermittently; it has no
# quarrel with GitHub's runners, which is where every other ingest already
# talks to it from.
on:
  schedule:
    # Every six hours, so a five-hour bite never overlaps the next start.
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      rate:
        description: Requests a second
        default: "25"
      max-seconds:
        description: Stop cleanly after this long
        default: "16200"

permissions:
  contents: read

# Two sweeps writing the checkpoint would lose one of their positions, and
# cancelling one midway throws away the block it was in.
concurrency:
  group: manager-sweep
  cancel-in-progress: false

jobs:
  sweep:
    name: Sweep the next block of the register
    runs-on: ubuntu-latest
    timeout-minutes: 340
    permissions:
      # The results and the checkpoint are pushed back.
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip

      - name: Install engine
        run: python -m pip install -e ".[dev]"

      # The cheap half of the same question, run first. The Overall league is an
      # ordinary classic league holding every entry, fifty to a page, so the top
      # ten thousand of the current season is two hundred requests where the id
      # sweep below needs thirteen million. What it cannot do is reach
      # backwards -- the league shows the season it is in and no other -- which
      # is why both exist and why this one goes first.
      - name: Harvest this season's elite from the Overall league
        timeout-minutes: 45
        run: python -m fpl_andres.cli.harvest_league | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Sweep
        id: sweep
        timeout-minutes: 330
        run: |
          set +e
          python -m fpl_andres.cli.sweep_managers \
            --resume \
            --rate "${{ inputs.rate || '25' }}" \
            --max-seconds "${{ inputs.max-seconds || '16200' }}" \
            | tee -a "$GITHUB_STEP_SUMMARY"
          status=${PIPESTATUS[0]}
          # 2 is the sweep stopping because FPL told it to often enough to
          # matter. That is the throttle working, not a broken run: the
          # checkpoint is written per block, so the next run resumes. Failing
          # the schedule for it would paint main red every six hours for
          # something that needs no action.
          if [ "$status" = "2" ]; then
            echo "FPL asked us to stop; position kept, resuming next run." \
              >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          exit "$status"

      # The ranking is derived from the catalogue this run just extended, so
      # leaving it to a hand-run makes it stale by construction: the sweep
      # moved every six hours and FPL500 last moved whenever somebody
      # remembered. Rebuilding here costs seconds and nothing can drift.
      - name: Rank the catalogue the sweep just extended
        run: bash scripts/republish-fpl500.sh | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Commit the position and anything it found
        run: |
          paths="data/cohort/managers.jsonl data/cohort/sweep-checkpoint.json data/cohort/fpl500.json data/cohort/fpl100.json apps/web/src/data/fpl500.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          stage() {
            bash scripts/republish-fpl500.sh
            npx --yes prettier@3 --write \
              data/cohort/sweep-checkpoint.json \
              data/cohort/fpl100.json
            git add $paths
          }
          stage
          if git diff --cached --quiet -- $paths; then
            echo "The sweep moved nothing."
            exit 0
          fi
          next=$(python -c "import json;print(json.load(open('data/cohort/sweep-checkpoint.json'))['next_id'])")
          git commit -m "chore: sweep the register as far as id ${next}"
          for attempt in 1 2 3 4 5; do
            git pull --rebase --autostash || git rebase --abort || true
            if git push; then
              exit 0
            fi
            echo "push rejected on attempt $attempt; rebuilding on the base that arrived"
            rm -rf "$RUNNER_TEMP/keep"
            mkdir -p "$RUNNER_TEMP/keep"
            cp data/cohort/managers.jsonl "$RUNNER_TEMP/keep/managers.jsonl"
            cp data/cohort/sweep-checkpoint.json "$RUNNER_TEMP/keep/sweep-checkpoint.json"
            cp data/cohort/fpl100.json "$RUNNER_TEMP/keep/fpl100.json"
            git fetch origin "$GITHUB_REF_NAME"
            git reset --hard "origin/$GITHUB_REF_NAME"
            cp "$RUNNER_TEMP/keep/managers.jsonl" data/cohort/managers.jsonl
            cp "$RUNNER_TEMP/keep/sweep-checkpoint.json" data/cohort/sweep-checkpoint.json
            cp "$RUNNER_TEMP/keep/fpl100.json" data/cohort/fpl100.json
            stage
            if git diff --cached --quiet -- $paths; then
              echo "the base that arrived already carries this sweep"
              exit 0
            fi
            next=$(python -c "import json;print(json.load(open('data/cohort/sweep-checkpoint.json'))['next_id'])")
            git commit -m "chore: sweep the register as far as id ${next}"
          done
          echo "could not push the manager sweep after five attempts" >&2
          exit 1
