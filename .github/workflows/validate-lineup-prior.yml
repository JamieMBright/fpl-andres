name: Validate Lineup Prior

# A probable XI is validation evidence, never a production input. After the
# Saturday fixtures FPL's live endpoint publishes `starts`; this compares the
# dated prior and the model with that actual XI, then commits the report once.
# Triggered manually on 2026-08-22 to complete GW1 validation against actuals.

on:
  schedule:
    - cron: "35 18 * * 6"
  push:
    paths:
      - ".github/workflows/validate-lineup-prior.yml"
      - "data/lineup-validation/*-prior.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: validate-lineup-prior
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip

      - name: Install engine
        run: python -m pip install -e .

      - name: Compare with actual starters
        run: python -m fpl_andres.cli.validate_lineup_prior --require-actual

      - name: Commit completed validation
        run: |
          npx --yes prettier@3 --write data/lineup-validation/*.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/lineup-validation/*.json
          if git diff --cached --quiet -- data/lineup-validation/*.json; then
            echo "lineup validation unchanged"
            exit 0
          fi
          git commit -m "Validate the Leeds lineup prior"
          git pull --rebase --autostash
          git push
