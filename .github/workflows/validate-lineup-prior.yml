name: Validate Lineup Prior

# A probable XI is validation evidence, never a production input. After the
# Saturday fixtures FPL's live endpoint publishes `starts`; this compares the
# dated prior and the model with that actual XI, then commits the report once.
# Triggered manually on 2026-08-22 to complete GW1 validation against actuals.

on:
  schedule:
    - cron: "35 18 * * 6"
  push:
    paths:
      - ".github/workflows/validate-lineup-prior.yml"
      - "data/lineup-validation/*-prior.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: validate-lineup-prior
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install engine
        run: |
          python -m pip install --upgrade pip setuptools wheel -c constraints-security.txt
          python -m pip install -c constraints-security.txt -e .

      - name: Compare with actual starters
        run: python -m fpl_andres.cli.validate_lineup_prior --require-actual

      - name: Commit completed validation
        run: |
          npx --yes prettier@3 --write data/lineup-validation/*.json
          rebuild() {
            python -m fpl_andres.cli.validate_lineup_prior --require-actual
            npx --yes prettier@3 --write data/lineup-validation/*.json
          }
          source scripts/publish-artifact.sh
          publish_artifact "Validate the Leeds lineup prior" rebuild data/lineup-validation/*.json
