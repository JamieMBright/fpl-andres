name: Ingest Bookmaker Odds

# Runs here and only here. Every price host fails at the TLS handshake from the
# owner's network behind a gambling-category content filter, while the same
# hosts answer normally from a GitHub runner. The blocker is the desk, not the
# feed, and this is the same pattern `validate` already uses for the corpus.
#
# What lands in the repository is not odds. It is the expected goals and the
# clean-sheet probability each fixture's market implies, which are the
# quantities the scoring model already speaks. When the CSV has no current
# Premier League rows, the job reads h2h, its paired lay view, totals and
# alternate totals for uncovered fixtures from The Odds API, capped to the
# nearest round and retained between daily runs.
# Nothing here emits or implies a betting recommendation, and the site never
# links to a bookmaker.

on:
  # Auto-trigger when live gameweek data is captured
  workflow_run:
    workflows: ["Capture settled gameweeks", "Capture live current gameweek"]
    types: [completed]
  schedule:
    # Fallback: daily. Fixtures land on every day of the week now, so a twice-weekly grab
    # would leave a midweek round priced off a stale scrape. Free on a public
    # repository, and the job commits only when the prices actually moved, so a
    # quiet day costs one CSV fetch and nothing else.
    - cron: "23 8 * * *"
    # Friday evening as well: closest to the usual Saturday-morning deadline.
    - cron: "23 20 * * 5"
  workflow_dispatch:
    inputs:
      season:
        description: "Season in YYYY-YY form, e.g. 2026-27. Blank derives it from the calendar."
        required: false
        default: ""
        type: string
      backfill:
        description: "Also fetch the four backtest seasons (2022-23 to 2025-26) into data/odds. Run this once."
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ingest-odds
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    # The API keys are scoped to this environment.
    environment: production
    timeout-minutes: 45
    permissions:
      # Needed to commit the refreshed artifact back to the branch.
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 20.20.2

      - name: Install JavaScript dependencies
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate
          pnpm install --frozen-lockfile

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip

      - name: Install engine
        run: python -m pip install -e .

      - name: Validate dispatch input
        env:
          ODDS_SEASON: ${{ inputs.season }}
        run: |
          if [ -n "$ODDS_SEASON" ] && ! printf '%s' "$ODDS_SEASON" | grep -qE '^20[0-9]{2}-[0-9]{2}$'; then
            echo "season must look like 2026-27, got: $ODDS_SEASON" >&2
            exit 1
          fi

      - name: Fetch odds and publish the goals distribution
        env:
          # Passed as env rather than inlined, so no input reaches the shell as code.
          ODDS_SEASON: ${{ inputs.season }}
          ODDS_BACKFILL: ${{ inputs.backfill }}
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
        run: |
          season="$ODDS_SEASON"
          if [ -z "$season" ]; then
            # A season starts in August, so before August the current season
            # began in the previous calendar year.
            year=$(date -u +%Y)
            month=$(date -u +%m)
            if [ "$month" -lt 8 ]; then
              year=$((year - 1))
            fi
            season="$year-$(printf '%02d' $(( (year + 1) % 100 )))"
          fi
          echo "season: $season"
          extra=()
          if [ "$ODDS_BACKFILL" = "true" ]; then
            extra+=(--backfill-seasons 2022-23 2023-24 2024-25 2025-26)
          fi
          python -m fpl_andres.cli.ingest_odds --season "$season" "${extra[@]}"

      - name: Verify the artifact joins onto FPL clubs
        # A green fetch proves nothing on its own. This reads the artifact back
        # through the same loader the model uses, so a run that passes has
        # exercised fetch, parse, de-vig, fit and join end to end.
        run: |
          python - <<'PY'
          from pathlib import Path
          from fpl_andres.models.fixture_odds import OddsArtifactError, club_views, load_fixture_odds

          for path in sorted(Path("data/odds").glob("*.json")) + [
              Path("apps/web/src/data/fixture-odds.json")
          ]:
              if not path.exists():
                  # Nothing priced yet is a legitimate pre-season state.
                  print(f"{path} not written this run")
                  continue
              try:
                  fixtures = load_fixture_odds(path)
              except OddsArtifactError as exc:
                  # Probe and capability files (e.g. api-football-historical-capability.json)
                  # live alongside the odds artifacts and are not odds artifacts themselves.
                  print(f"{path} skipped (not an odds artifact): {exc}")
                  continue
              views = club_views(fixtures)
              if not views:
                  raise SystemExit(f"{path} joined onto no clubs")
              print(f"{path}: {len(fixtures)} fixtures across {len(views)} clubs")
              for club in sorted(views)[:3]:
                  first = views[club][0]
                  print(
                      f"  {club} v {first.opponent} "
                      f"xG {first.expected_goals:.2f} "
                      f"clean sheet {first.clean_sheet:.3f}"
                  )
          PY

      - name: Survey every priced source, not just this one
        # football-data.co.uk prices matches and nothing else. Everything that
        # prices a player needs a credential, and "the ingest only fetched one
        # source" is what it looks like when none are set. This reaches every
        # source it can, names the ones it cannot, and says which secret
        # unlocks each -- in the same run, so the answer is never a guess.
        env:
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
          API_FOOTBALL_API_KEY: ${{ secrets.API_FOOTBALL_API_KEY }}
          BETFAIR_APP_KEY: ${{ secrets.BETFAIR_APP_KEY }}
          BETFAIR_SESSION_TOKEN: ${{ secrets.BETFAIR_SESSION_TOKEN }}
        run: |
          python -m fpl_andres.cli.survey_player_props \
            --json player-props-catalogue.json \
            --require football-data

      - name: Upload the source catalogue
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: player-props-catalogue
          path: player-props-catalogue.json
          if-no-files-found: warn
          retention-days: 30

      - name: Commit the refreshed artifact
        run: |
          # Stage only what this run actually produced. A pathspec matching
          # nothing is fatal to `git add`, and pre-season the live artifact is
          # legitimately absent.
          SOURCES="apps/web/src/data/fixture-odds.json data/odds"
          DERIVED="apps/web/public/fpl-global.json \
            apps/web/src/data/deadlines.json \
            apps/web/src/data/season-inputs.json \
            apps/web/src/data/opening-squad.json \
            apps/web/src/data/season-plan.json \
            data/prospective/*.json"
          stage() {
            for path in $SOURCES; do
              if [ -e "$path" ]; then
                # Before the staged-diff check, so a rewrite that is only
                # formatting never reaches `git commit` and fails it empty.
                npx --yes prettier@3 --write "$path"
                git add -A -- "$path"
              else
                echo "$path not written this run"
              fi
            done
            # The derived chain only means anything once the live artifact
            # exists, and regenerating it against an unchanged book would still
            # rewrite `generatedAt` and commit noise every day.
            if [ -e apps/web/src/data/fixture-odds.json ] &&
              ! git diff --cached --quiet -- apps/web/src/data/fixture-odds.json; then
              bash scripts/republish-plan.sh
              # shellcheck disable=SC2086
              git add $DERIVED
            else
              echo "live fixture odds did not move; season inputs stay unchanged"
            fi
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          stage
          if git diff --cached --quiet; then
            echo "prices unchanged since the last run; nothing to commit"
            exit 0
          fi
          git commit -m "Refresh the bookmaker-implied goals distribution"
          for attempt in 1 2 3 4 5; do
            # A plain rebase first: when nothing else moved this is a no-op and
            # the push lands. When it does conflict, abort and rebuild instead —
            # see scripts/republish-plan.sh for why a rebase cannot settle it.
            git pull --rebase --autostash || git rebase --abort || true
            if git push; then
              exit 0
            fi
            echo "push rejected on attempt $attempt; rebuilding on the base that arrived"
            # Keep what the provider was paid for, take the base that arrived,
            # put the fetched prices back and rebuild the derived chain on top.
            rm -rf "$RUNNER_TEMP/keep"
            mkdir -p "$RUNNER_TEMP/keep/odds"
            if [ -e apps/web/src/data/fixture-odds.json ]; then
              cp apps/web/src/data/fixture-odds.json "$RUNNER_TEMP/keep/fixture-odds.json"
            fi
            if [ -d data/odds ]; then
              cp -r data/odds/. "$RUNNER_TEMP/keep/odds/"
            fi
            git fetch origin "$GITHUB_REF_NAME"
            git reset --hard "origin/$GITHUB_REF_NAME"
            if [ -e "$RUNNER_TEMP/keep/fixture-odds.json" ]; then
              cp "$RUNNER_TEMP/keep/fixture-odds.json" apps/web/src/data/fixture-odds.json
            fi
            mkdir -p data/odds
            cp -r "$RUNNER_TEMP/keep/odds/." data/odds/
            stage
            if git diff --cached --quiet; then
              echo "the base that arrived already carries these prices"
              exit 0
            fi
            git commit -m "Refresh the bookmaker-implied goals distribution"
          done
          echo "could not push the refreshed odds after five attempts" >&2
          exit 1
