name: Model validation

# The backtest needs the history corpus, which lives in Supabase, so it cannot
# run on a developer's machine and has never run automatically. That left the
# published numbers pinned to whenever somebody last remembered to refresh them
# -- which is how the calibration page came to claim the naive baseline was
# winning months after it had stopped.
#
# So it runs here, on every change to the projection that lands on main. The
# refreshed artifact and one appended history row are committed back, and the
# summary prints what moved.
on:
  push:
    branches: [main]
    paths:
      - python/fpl_andres/models/**
      - python/fpl_andres/backtesting/**
      - python/fpl_andres/simulation/**
      - python/fpl_andres/holdout.py
      - python/fpl_andres/rules.py
      - python/fpl_andres/model_version.py
      - python/fpl_andres/cli/validate.py
      - python/fpl_andres/cli/publish_projections.py
      - python/fpl_andres/cli/experiment_xstart.py
      - python/fpl_andres/cli/experiment_recent_form_weight.py
      - python/fpl_andres/experiments/**
      - python/fpl_andres/cli/publish_opening_squad.py
      - python/fpl_andres/cli/publish_season_inputs.py
      - python/fpl_andres/cli/publish_season_plan.py
      - python/fpl_andres/cli/freeze_prospective.py
      - python/fpl_andres/prospective.py
      - packages/quick-solver/src/**
      - apps/web/scripts/publish-canonical-opening.ts
      - apps/web/src/state/season-solver.ts
      - python/fpl_andres/cohorts/points_to_rank.py
      - data/cohort/points-to-rank.json
      - python/fpl_andres/cli/track_model.py
      - python/tests/test_measured_performance.py
      # Keep the workflow in its own filter: touching this recovery note gives
      # an Actions outage a normal push path without needing dispatch scope.
      - .github/workflows/validate-model.yml
  workflow_dispatch:

permissions:
  contents: read

# Never two runs writing the artifact at once, and never cancel one midway: a
# half-written history file is worse than a late one.
concurrency:
  group: validate-model
  cancel-in-progress: false

jobs:
  validate:
    name: Backtest the projection
    runs-on: ubuntu-latest
    timeout-minutes: 150
    environment: production
    permissions:
      # The refreshed artifact and the appended history row are pushed back.
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 20.20.2

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@9.15.9 --activate

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip

      - name: Install engine
        run: python -m pip install -e ".[dev]"

      - name: Record the numbers being replaced
        run: cp apps/web/src/data/validation.json "$RUNNER_TEMP/before.json"

      - name: Run the backtest
        # Runs 41 and 42 completed in 15.47 and 19.55 minutes. Sixty minutes is
        # bounded headroom for a loaded hosted runner, not a changed criterion.
        timeout-minutes: 60
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python -m fpl_andres.cli.validate

      - name: Tune and hold out current-season xStart evidence
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          rm -f data/experiments/xstart-current-season.json
          python -m fpl_andres.cli.experiment_xstart --code-revision "$GITHUB_SHA"

      - name: Tune and hold out the recent-form blend
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          rm -f data/experiments/recent-form-weight.json
          python -m fpl_andres.cli.experiment_recent_form_weight --code-revision "$GITHUB_SHA"

      - name: Append the run to the model history
        run: |
          python -m fpl_andres.cli.track_model --code-revision "$GITHUB_SHA"

      # Cheap next to the backtest, and it checks the thing every projected
      # point is built on: that this project's scoring table agrees with the
      # one FPL actually applied.
      - name: Reconcile realised points against the scoring table
        timeout-minutes: 15
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python -m fpl_andres.cli.reconcile

      # The site reads the published projection, not the backtest. Republished
      # here because this is the only place that can: the owner's network
      # intercepts TLS to Supabase, so a model change made there lands dormant
      # until somebody remembers to regenerate by hand -- which is how a scored
      # improvement can sit unshipped for weeks.
      - name: Republish the projection the site reads
        # Run 41 needed 38.6 minutes and run 42 hit the old 40-minute ceiling.
        # This chain includes the bounded 38-week static-plan solve.
        timeout-minutes: 60
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          python -m fpl_andres.cli.publish_projections \
            --season 2026-27 \
            --previous-season 2025-26 \
            --live data/live/2026-27
          python -m fpl_andres.cli.publish_opening_squad
          python -m fpl_andres.cli.publish_season_inputs
          pnpm --filter @fpl-andres/web publish:canonical-opening
          weekly_free_transfers="$(node -e "const p=require('./apps/web/src/data/season-inputs.json'); process.stdout.write(String(p.rules.weeklyFreeTransfers))")"
          transfer_cost_points="$(node -e "const p=require('./apps/web/src/data/season-inputs.json'); process.stdout.write(String(p.rules.transferCostPoints))")"
          rules_reference="$(node -e "const p=require('./apps/web/src/data/season-inputs.json'); process.stdout.write(p.rules.sourceReference)")"
          python -m fpl_andres.cli.publish_season_plan \
            --weekly-free-transfers "$weekly_free_transfers" \
            --transfer-cost-points "$transfer_cost_points" \
            --rules-reference "$rules_reference"

      # Python writes the artifact and prettier owns the file. Without this the
      # refresh commit is format-clean nowhere and reddens main on arrival.
      - name: Format what is about to be committed
        run: |
          pnpm exec prettier --write \
            apps/web/src/data/validation.json \
            apps/web/src/data/model-history.json \
            apps/web/src/data/reconciliation.json \
            apps/web/src/data/projections.json \
            apps/web/src/data/projections-meta.json \
            apps/web/src/data/season-inputs.json \
            apps/web/src/data/opening-squad.json \
            apps/web/src/data/season-plan.json \
            data/experiments/xstart-current-season.json \
            data/experiments/recent-form-weight.json \
            docs/MODEL_CARDS.md

      - name: Freeze the prospective event inputs
        run: |
          python -m fpl_andres.cli.freeze_prospective \
            --frozen-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --code-revision "$GITHUB_SHA"
          pnpm exec prettier --write data/prospective/*.json

      - name: Prove the document agrees with the artifact
        run: python -m pytest python/tests/test_measured_performance.py -q

      - name: Report what moved
        env:
          BEFORE: ${{ runner.temp }}/before.json
        run: python -m fpl_andres.cli.compare_validation --before "$BEFORE" >> "$GITHUB_STEP_SUMMARY"

      # Uploaded whatever happens to the commit below, so a run whose push is
      # rejected has still produced something a human can read.
      - name: Upload the refreshed artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: validation
          path: |
            apps/web/src/data/validation.json
            apps/web/src/data/model-history.json
            apps/web/src/data/reconciliation.json
            apps/web/src/data/opening-squad.json
            apps/web/src/data/projections.json
            apps/web/src/data/projections-meta.json
            apps/web/src/data/season-inputs.json
            apps/web/src/data/season-plan.json
            data/experiments/xstart-current-season.json
            data/experiments/recent-form-weight.json
            data/prospective/*.json
          retention-days: 30

      - name: Commit the refreshed artifact
        run: |
          paths="apps/web/src/data/validation.json apps/web/src/data/model-history.json apps/web/src/data/reconciliation.json apps/web/src/data/projections.json apps/web/src/data/projections-meta.json apps/web/src/data/season-inputs.json apps/web/src/data/opening-squad.json apps/web/src/data/season-plan.json data/experiments/xstart-current-season.json data/experiments/recent-form-weight.json data/prospective/*.json docs/MODEL_CARDS.md"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Staged before the comparison. `git diff` does not look at untracked
          # files, so a run that creates one of these would call it unchanged.
          git add $paths
          if git diff --cached --quiet -- $paths; then
            echo "Nothing moved."
            exit 0
          fi
          git commit -m "chore: refresh the backtest for the model on $GITHUB_SHA"
          for attempt in 1 2 3 4 5; do
            # A plain rebase first: when nothing else moved this is a no-op and
            # the push lands. This solve takes the better part of an hour, so
            # an odds job landing underneath it is the normal case rather than
            # the unlucky one, and every artifact below conflicts when it does.
            git pull --rebase --autostash || git rebase --abort || true
            if git push; then
              exit 0
            fi
            echo "push rejected on attempt $attempt; rebuilding on the base that arrived"
            rm -rf "$RUNNER_TEMP/backtest"
            for path in $paths; do
              if [ -e "$path" ]; then
                mkdir -p "$RUNNER_TEMP/backtest/$(dirname "$path")"
                cp "$path" "$RUNNER_TEMP/backtest/$path"
              fi
            done
            git fetch origin "$GITHUB_REF_NAME"
            git reset --hard "origin/$GITHUB_REF_NAME"
            for path in $paths; do
              if [ -e "$RUNNER_TEMP/backtest/$path" ]; then
                mkdir -p "$(dirname "$path")"
                cp "$RUNNER_TEMP/backtest/$path" "$path"
              fi
            done
            # The backtest itself is kept: nothing else produces it, and it is
            # hours of work. The planning chain is rebuilt instead, because the
            # base that arrived may carry odds this solve never saw.
            bash scripts/republish-plan.sh
            git add $paths
            if git diff --cached --quiet -- $paths; then
              echo "the base that arrived already carries this backtest"
              exit 0
            fi
            git commit -m "chore: refresh the backtest for the model on $GITHUB_SHA"
          done
          echo "could not push the refreshed backtest after five attempts" >&2
          exit 1
