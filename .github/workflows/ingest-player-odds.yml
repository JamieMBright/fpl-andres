name: Ingest Player Odds

# Anytime-scorer, assist, card and shots-on-target prices, per player, per
# fixture, de-vigged and joined onto FPL element ids.
#
# Runs here and only here. Every price host fails at the TLS handshake from the
# owner's network behind a gambling-category content filter, while the same
# hosts answer normally from a GitHub runner.
#
# Needs one secret:
#
#   THE_ODDS_API_KEY   https://the-odds-api.com   free tier, 500 requests a month
#
# See docs/PLAYER_MARKETS.md for how to get one and where to put it.
#
# The free tier is 500 requests a month and this key also pays for the weekly
# market survey. What one fixture costs is not known: the host charges per
# market per region, so `budget` is written in requests rather than fixtures and
# the run prints what it actually spent. Size the number below off that log, not
# off a guess -- and python/tests/test_api_budgets.py holds the schedules here
# and in the survey under the allowance between them.
#
# Player props open days rather than months out, but no provider publishes an
# exact opening hour. Run daily, then stop from the committed FPL deadline list
# unless the next deadline is within seven days. The provider sees no request
# outside that window; the 15-request cap bounds runs that pass it.
#
# Nothing here emits or implies a betting recommendation. A price is read as a
# probability and used as evidence about a footballer.

on:
  schedule:
    # An hour before the earliest a deadline lands. Cron has no timezone, so
    # 09:00 UTC is 10:00 British Summer Time and 09:00 in winter.
    - cron: "0 9 * * *"
  # A change to this file is how a run gets asked for without a token. It spends
  # the default budget below, which is why the budget has one.
  push:
    paths:
      - ".github/workflows/ingest-player-odds.yml"
  workflow_dispatch:
    inputs:
      budget:
        description: "How many requests this run may spend, against 500 a month."
        required: false
        default: "15"
        type: string

permissions:
  contents: write

concurrency:
  group: ingest-player-odds
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    # The API keys are scoped to this environment. Without the declaration the
    # job cannot see them and the fetch step exits on an empty key, which is
    # exactly how run 1 failed.
    environment: production
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip

      - name: Install engine
        run: python -m pip install -e .

      - name: Validate dispatch input
        env:
          BUDGET: ${{ inputs.budget }}
        run: |
          if [ -n "$BUDGET" ] && ! printf '%s' "$BUDGET" | grep -qE '^[0-9]{1,3}$'; then
            echo "budget must be a number, got: $BUDGET" >&2
            exit 1
          fi

      - name: Fetch player markets
        env:
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
          # Read only to tell "nowhere" apart from "the other namespace". A
          # variable is not a secret: GitHub masks secrets in logs and prints
          # variables verbatim, so the key is refused here rather than used.
          THE_ODDS_API_KEY_AS_VARIABLE: ${{ vars.THE_ODDS_API_KEY }}
          BUDGET: ${{ inputs.budget }}
        run: |
          if [ -z "$THE_ODDS_API_KEY" ]; then
            if [ -n "$THE_ODDS_API_KEY_AS_VARIABLE" ]; then
              echo "THE_ODDS_API_KEY is an environment VARIABLE, not a secret." >&2
              echo "Variables are unmasked in logs, so this run will not use it." >&2
              echo "Move it to Settings -> Environments -> production ->" >&2
              echo "Environment secrets, and delete the variable." >&2
            else
              echo "THE_ODDS_API_KEY is not set as a secret of the 'production'" >&2
              echo "environment. Add it at Settings -> Environments ->" >&2
              echo "production -> Environment secrets, then run again." >&2
            fi
            exit 1
          fi
          python -m fpl_andres.cli.ingest_player_odds \
            --season "$(date -u +%Y)-$(printf '%02d' $((10#$(date -u +%y) + 1)))" \
            --within-days 7 \
            --budget "${BUDGET:-15}"

      - name: Commit the odds
        run: |
          # A run before the books open player markets writes nothing and exits
          # clean, which is the correct answer and not a fault. Without this
          # guard the next line runs prettier on a path that does not exist and
          # reddens the schedule for the one outcome it was told to accept.
          if [ ! -f apps/web/src/data/player-odds.json ]; then
            echo "no odds artifact this run; nothing to commit"
            exit 0
          fi
          # `player-odds.json` is an input, not a shipped recommendation. The
          # plan reads `season-inputs.json`, so commit both or neither.
          python -m fpl_andres.cli.publish_season_inputs
          # prettier owns the file and Python does not write it that way. An
          # unformatted bot commit reddens the next human push, not this run.
          # Formatting before the diff check also stops a rewrite that is only
          # formatting from reaching `git commit` and failing it empty.
          npx --yes prettier@3 --write \
            apps/web/src/data/player-odds.json \
            apps/web/src/data/season-inputs.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Staged first, then compared against the index. `git diff` does not
          # look at untracked files, so the first run to produce this artifact
          # would report "unchanged" and throw it away.
          git add \
            apps/web/src/data/player-odds.json \
            apps/web/src/data/season-inputs.json
          if git diff --cached --quiet -- \
            apps/web/src/data/player-odds.json \
            apps/web/src/data/season-inputs.json; then
            echo "odds unchanged"
            exit 0
          fi
          git commit -m "Refresh player market odds"
          git pull --rebase --autostash
          git push
