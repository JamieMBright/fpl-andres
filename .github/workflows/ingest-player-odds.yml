name: Ingest Player Odds

# Anytime-scorer, assist, card and shots-on-target prices, per player, per
# fixture, de-vigged and joined onto FPL element ids.
#
# Runs here and only here. Every price host fails at the TLS handshake from the
# owner's network behind a gambling-category content filter, while the same
# hosts answer normally from a GitHub runner.
#
# Needs one secret:
#
#   ODDS_API_KEY   https://the-odds-api.com   free tier, 500 requests a month
#
# Each fixture priced costs one request, so `max-events` is the budget dial.
# Ten fixtures twice a week is about 80 a month and leaves room for the survey.
#
# Nothing here emits or implies a betting recommendation. A price is read as a
# probability and used as evidence about a footballer.

on:
  schedule:
    # Friday evening and Monday morning: after most team news, before the
    # weekend, and again once the round has settled.
    - cron: "13 19 * * 5"
    - cron: "13 9 * * 1"
  workflow_dispatch:
    inputs:
      max-events:
        description: "How many fixtures to price. Each costs one request."
        required: false
        default: "10"
        type: string

permissions:
  contents: write

concurrency:
  group: ingest-player-odds
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip

      - name: Install engine
        run: python -m pip install -e .

      - name: Validate dispatch input
        env:
          MAX_EVENTS: ${{ inputs.max-events }}
        run: |
          if [ -n "$MAX_EVENTS" ] && ! printf '%s' "$MAX_EVENTS" | grep -qE '^[0-9]{1,3}$'; then
            echo "max-events must be a number, got: $MAX_EVENTS" >&2
            exit 1
          fi

      - name: Fetch player markets
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          MAX_EVENTS: ${{ inputs.max-events }}
        run: |
          if [ -z "$ODDS_API_KEY" ]; then
            echo "ODDS_API_KEY is not set as a repository secret." >&2
            echo "Add it at Settings -> Secrets -> Actions, then run again." >&2
            exit 1
          fi
          python -m fpl_andres.cli.ingest_player_odds \
            --season "$(date -u +%Y)-$(printf '%02d' $((10#$(date -u +%y) + 1)))" \
            --max-events "${MAX_EVENTS:-10}"

      - name: Commit the odds
        run: |
          if git diff --quiet -- apps/web/src/data/player-odds.json; then
            echo "odds unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/data/player-odds.json
          git commit -m "Refresh player market odds"
          git pull --rebase --autostash
          git push
