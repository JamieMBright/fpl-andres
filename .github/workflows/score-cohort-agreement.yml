name: Score cohort agreement

# Rebuild the armband summary after every FPL500 capture.
#
# The agreement file is what the thesis-significance backtest reads to check
# whether its winner also describes elite behaviour. It is rebuilt here rather
# than inside `capture-fpl500` so the two jobs can fail independently: a
# capture that succeeds but whose agreement scoring crashes does not take the
# portfolio commit with it.
#
# The output is small and tracked in git. A diff shows exactly which weeks
# changed and whether the contested-week count moved.

on:
  workflow_run:
    workflows: ["Capture the FPL500"]
    types: [completed]
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/score-cohort-agreement.yml"

permissions:
  contents: write

concurrency:
  group: score-cohort-agreement
  cancel-in-progress: false

jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only run when the upstream capture succeeded, or on a manual dispatch.
    if: >
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install engine
        run: |
          python -m pip install --upgrade pip setuptools wheel -c constraints-security.txt
          python -m pip install -c constraints-security.txt -e .

      - name: Publish agreement summary
        run: |
          python -m fpl_andres.cli.publish_cohort_agreement \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Commit agreement summary
        run: |
          path="data/cohort/agreement.json"
          if [ ! -f "$path" ]; then
            echo "nothing to commit"
            exit 0
          fi
          npx --yes prettier@3 --write "$path"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$path"
          if git diff --cached --quiet -- "$path"; then
            echo "agreement unchanged"
            exit 0
          fi
          git commit -m "chore: update cohort agreement summary"
          git pull --rebase --autostash
          git push
