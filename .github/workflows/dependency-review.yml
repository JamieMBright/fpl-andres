name: Dependency Review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: dependency-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # `actions/dependency-review-action` needs the Dependency graph, and on a
  # private repository GitHub Advanced Security as well. Neither is available
  # here, so the action fails with "Dependency review is not supported on this
  # repository" on every PR -- a gate that can never go green tells you nothing.
  # Auditing the resolved lockfile gives the same answer from data we own.
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 20.20.2

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@9.15.9 --activate

      # Production dependencies only, and only high and above: a dev-only
      # advisory does not reach a visitor's browser, and a moderate one that
      # blocks every PR trains people to ignore the gate. The allowlist lives in
      # `pnpm.auditConfig.ignoreGhsas` in `package.json`, so the local run and
      # this job agree by construction.
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high
