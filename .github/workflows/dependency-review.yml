name: Dependency Review

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - ".github/workflows/dependency-review.yml"
      - "**/package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "pyproject.toml"
      - "constraints-security.txt"
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # `actions/dependency-review-action` needs the Dependency graph, and on a
  # private repository GitHub Advanced Security as well. Neither is available
  # here, so the action fails with "Dependency review is not supported on this
  # repository" on every PR -- a gate that can never go green tells you nothing.
  # Auditing the resolved lockfile gives the same answer from data we own.
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.1

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10.34.8 --activate

      - name: Install resolved dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Audit runtime and development dependencies
        run: pnpm audit --audit-level low

  python:
    name: Python security (${{ matrix.extra }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        extra: [dev, scrape]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"

      - name: Install audited environment
        run: |
          python -m pip install --upgrade pip setuptools wheel -c constraints-security.txt
          python -m pip install -c constraints-security.txt -e ".[${{ matrix.extra }}]" pip-audit==2.10.1

      - name: Check requirements and known vulnerabilities
        run: |
          python -m pip check
          python -m pip_audit --skip-editable --progress-spinner off
