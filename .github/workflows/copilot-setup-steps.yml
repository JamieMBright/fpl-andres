name: Copilot Setup Steps

# The coding agent's environment is ephemeral and firewalled. Without this it
# has to discover the toolchain by trial and error, and when that fails it
# hand-formats files instead of running prettier -- which is how three separate
# pull requests were opened to fix one markdown table and all three failed.
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

permissions:
  contents: read

jobs:
  # The name is load-bearing: Copilot looks for this exact job id and ignores
  # the file otherwise.
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 20.20.2

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@9.15.9 --activate

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install -e ".[dev]"

      # Proves the agent can actually run the gate it is expected to run, and
      # fails the setup loudly here rather than silently in a pull request.
      - name: Confirm the formatter is runnable
        run: pnpm format:check
