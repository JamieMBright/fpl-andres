name: Copilot Setup Steps

# The coding agent's environment is ephemeral and firewalled. Without this it
# has to discover the toolchain by trial and error, and when that fails it
# hand-formats files instead of running prettier -- which is how three separate
# pull requests were opened to fix one markdown table and all three failed.
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

permissions:
  contents: read

jobs:
  # The name is load-bearing: Copilot looks for this exact job id and ignores
  # the file otherwise.
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.1

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10.34.8 --activate

      - name: Cache pnpm store
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel -c constraints-security.txt
          python -m pip install -c constraints-security.txt -e ".[dev]"

      # Proves the agent can actually run the gate it is expected to run, and
      # fails the setup loudly here rather than silently in a pull request.
      - name: Confirm the formatter is runnable
        run: pnpm format:check
