name: Live FPL Contracts

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-fpl-contracts
  cancel-in-progress: true

jobs:
  validate-live-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install engine
        run: |
          python -m pip install --upgrade pip setuptools wheel -c constraints-security.txt
          python -m pip install -c constraints-security.txt -e .

      - name: Validate current FPL schema
        run: python -m fpl_andres.cli.live_contracts
