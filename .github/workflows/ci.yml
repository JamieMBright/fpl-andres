name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Pinned so set iteration order is identical on every run. A test that passes
# on one hash seed and fails on another fails in CI once a fortnight and cannot
# be reproduced locally.
env:
  PYTHONHASHSEED: "0"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Cheap and fails often. Runs alone so a stray space does not wait behind a
  # database container and a browser download to tell you about itself.
  format:
    name: Formatting
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20.20.2

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@9.15.9 --activate

      - name: Cache pnpm store
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

  # Audit item #78. `.env.example` names several live secrets, and a real one
  # committed by accident is not undone by deleting it in a later commit -- it
  # is in the history, and on any clone taken in between. The only fix is
  # rotation, so the gate has to catch it before the push lands.
  #
  # Audit item #143. Schema drift was one step inside `pnpm check`, so a
  # regenerated-but-uncommitted schema was reported as "Lint, types and unit
  # tests failed" and someone read four hundred lines of log to find out which.
  # It runs alone now, and it is the cheapest job in the file.
  secrets-and-contracts:
    name: Secret scan and schema drift
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          # Full history: a secret is still a secret in the commit that added
          # it, even when a later commit removes the line.
          fetch-depth: 0

      - name: Scan for committed secrets
        # gitleaks-action v2, resolved to its commit. A moving tag on a
        # security tool is a supply chain hole in the thing meant to close one.
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20.20.2

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@9.15.9 --activate

      - name: Cache pnpm store
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Check generated schema matches the contracts
        run: pnpm contracts:check

      - name: Check the contracts version was bumped with the schema
        run: pnpm contracts:version-gate

  checks:
    name: Lint, types and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20.20.2

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@9.15.9 --activate

      - name: Cache pnpm store
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install -e ".[dev]"

      - name: Validate repository
        run: pnpm check

  migrations:
    name: Database migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20.20.2

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@9.15.9 --activate

      - name: Cache pnpm store
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      # A clean reset is the only thing that catches a migration referencing a
      # table created by a later-sorting file: it passes on an already-migrated
      # environment and fails only here.
      - name: Validate database migrations
        timeout-minutes: 10
        run: |
          pnpm exec supabase db start
          pnpm exec supabase db reset --local
          pnpm exec supabase db lint --local --level warning

      # The teardown is the only recovery path from a partial SQL Editor paste,
      # because the migrations are not idempotent. Untested, it rots silently:
      # a table added without a matching drop leaves the re-apply failing on
      # "already exists", in the middle of an incident.
      - name: Exercise the rollback harness
        timeout-minutes: 10
        run: |
          pnpm exec supabase db reset --local
          psql "$(pnpm exec supabase status --output json | jq -r '.DB_URL')" \
            --set ON_ERROR_STOP=1 --file supabase/rollback/down.sql
          pnpm exec supabase db reset --local
          pnpm exec supabase db lint --local --level warning

  browser:
    name: Browser journeys
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20.20.2

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@9.15.9 --activate

      - name: Cache pnpm store
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve Playwright version
        id: playwright
        run: |
          version=$(pnpm --filter @fpl-andres/web exec playwright --version | awk '{print $2}')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install browser
        run: pnpm --filter @fpl-andres/web exec playwright install --with-deps chromium

      - name: Run browser journeys
        run: pnpm test:e2e

      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: playwright-report
          path: apps/web/test-results
          retention-days: 7

      # Uploaded on success too. A run that passed on the second attempt is
      # exactly the run worth inspecting, and `if: failure()` would never
      # collect it.
      - name: Upload the flake record
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: playwright-results
          path: apps/web/playwright-report/results.json
          retention-days: 30
          if-no-files-found: ignore
