name: Capture live current gameweek

# During an active gameweek, capture lineup updates as matches play out.
# This keeps season-inputs.json (browser solver input) fresh with current
# start rates while games are in progress.
#
# Runs frequently during typical match times, does nothing if no gameweek is
# active (bootstrap.current_event is null).

on:
  schedule:
    # Every 2 hours, every day. Bootstrap will skip if no active gameweek.
    - cron: "17 */2 * * *"
  workflow_dispatch:
    inputs:
      event:
        description: "Capture this gameweek. Empty captures the current event."
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: capture-live-current
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip

      - name: Install engine
        run: python -m pip install -e .

      - name: Check if gameweek is active
        id: check
        env:
          DISPATCH_EVENT: ${{ inputs.event }}
        run: |
          if [ -n "$DISPATCH_EVENT" ]; then
            echo "active=true" >> $GITHUB_OUTPUT
            echo "Dispatch requested gameweek $DISPATCH_EVENT"
          else
            set +e
            current_event=$(python -c "
              import urllib.request, json
              url = 'https://fantasy.premierleague.com/api/bootstrap-static/'
              with urllib.request.urlopen(url) as resp:
                bootstrap = json.loads(resp.read())
                print(bootstrap.get('events', [{}])[0].get('id', ''))
            ")
            set -e
            if [ -n "$current_event" ] && [ "$current_event" != "None" ]; then
              echo "active=true" >> $GITHUB_OUTPUT
              echo "EVENT=$current_event" >> $GITHUB_ENV
              echo "Current gameweek is $current_event"
            else
              echo "active=false" >> $GITHUB_OUTPUT
              echo "No active gameweek, skipping"
            fi
          fi

      - name: Capture current gameweek lineup
        if: steps.check.outputs.active == 'true'
        env:
          EVENT: ${{ inputs.event || env.EVENT }}
        run: |
          set -o pipefail
          if [ -n "$EVENT" ]; then
            python -m fpl_andres.cli.capture_live_gameweek \
              --season 2026-27 --event "$EVENT" 2>&1 | tee -a capture.log
          else
            python -m fpl_andres.cli.capture_live_gameweek \
              --season 2026-27 2>&1 | tee -a capture.log
          fi

      - name: Format captured files
        if: steps.check.outputs.active == 'true'
        run: |
          npx --yes prettier@3 --write data/live/**/*.json

      - name: Commit live lineup updates
        if: steps.check.outputs.active == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live
          if ! git diff --cached --quiet; then
            git commit -m "chore: update live gameweek lineup snapshots"
            git pull --rebase --autostash
            git push
          else
            echo "No lineup changes"
          fi
