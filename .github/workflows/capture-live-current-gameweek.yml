name: Capture live current gameweek

# During an active gameweek, capture lineup updates as matches play out.
# This keeps season-inputs.json (browser solver input) fresh with current
# start rates while games are in progress.
#
# Runs every 2 hours. Skips only when both current_event AND next_event are
# null (no season yet). Falls back to next_event in the pre-kickoff window
# (post-deadline, before first match) so lineups are always captured.

on:
  schedule:
    # Every 2 hours, every day.
    - cron: "17 */2 * * *"
  workflow_dispatch:
    inputs:
      event:
        description: "Capture this gameweek. Empty captures the current event."
        required: false
        default: ""
        type: string
  # A workflow change can immediately refresh the current live round. The
  # generated data commits do not touch this file, so this cannot self-trigger.
  push:
    paths:
      - ".github/workflows/capture-live-current-gameweek.yml"

permissions:
  contents: write

concurrency:
  group: capture-live-current
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip

      - name: Install engine
        run: python -m pip install -e .

      - name: Check if gameweek is active
        id: check
        env:
          DISPATCH_EVENT: ${{ inputs.event }}
        run: |
          if [ -n "$DISPATCH_EVENT" ]; then
            echo "active=true" >> $GITHUB_OUTPUT
            echo "Dispatch requested gameweek $DISPATCH_EVENT"
          else
            # Fetch bootstrap. Fail loudly on network/parse errors so they
            # are not silently treated as "no active gameweek".
            # The Python sits at the literal block's own indentation: YAML
            # strips exactly that much, so the interpreter is handed code
            # starting at column zero. Indent it further and Python raises
            # IndentationError; indent it less and the YAML block ends here.
            current_event=$(python -c "
          import json, sys, urllib.request

          try:
              req = urllib.request.Request(
                  'https://fantasy.premierleague.com/api/bootstrap-static/',
                  headers={'User-Agent': 'fpl-andres/ci'},
              )
              with urllib.request.urlopen(req, timeout=15) as resp:
                  bootstrap = json.loads(resp.read().decode())
          except Exception as exc:
              print(f'bootstrap fetch failed: {exc}', file=sys.stderr)
              sys.exit(1)

          # bootstrap-static publishes no top-level current_event -- the key is
          # absent and .get() returns None every time -- so the per-event flags
          # are the only authority. is_current is the round being played;
          # is_next covers the window between deadline and first kickoff, when
          # nothing is current but the lineups are already worth having.
          events = bootstrap.get('events') or []
          gw = next((e['id'] for e in events if e.get('is_current')), None)
          if gw is None:
              gw = next((e['id'] for e in events if e.get('is_next')), None)
          print(gw or '')
          ")
            if [ -n "$current_event" ]; then
              echo "active=true" >> $GITHUB_OUTPUT
              echo "EVENT=$current_event" >> $GITHUB_ENV
              echo "Current gameweek is $current_event"
            else
              echo "active=false" >> $GITHUB_OUTPUT
              echo "No active gameweek, skipping"
            fi
          fi

      - name: Capture current gameweek lineup
        if: steps.check.outputs.active == 'true'
        env:
          EVENT: ${{ inputs.event || env.EVENT }}
        run: |
          set -o pipefail
          if [ -n "$EVENT" ]; then
            python -m fpl_andres.cli.capture_live_gameweek \
              --season 2026-27 --event "$EVENT" 2>&1 | tee -a capture.log
          else
            python -m fpl_andres.cli.capture_live_gameweek \
              --season 2026-27 2>&1 | tee -a capture.log
          fi

      - name: Build partial xStart performance
        if: steps.check.outputs.active == 'true'
        run: |
          set -o pipefail
          python -m fpl_andres.cli.build_xstart_validation \
            --allow-partial | tee -a capture.log

      - name: Format captured files
        if: steps.check.outputs.active == 'true'
        run: |
          npx --yes prettier@3 --write data/live/**/*.json
          npx --yes prettier@3 --write apps/web/src/data/xstart-validation.json

      - name: Commit live lineup updates
        if: steps.check.outputs.active == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live apps/web/src/data/xstart-validation.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update live gameweek lineup snapshots"
            git pull --rebase --autostash
            git push
          else
            echo "No lineup changes"
          fi
