name: Capture the FPL500

# What the cohort actually owns, once a gameweek.
#
# The catalogue knows who is good. It does not know what they hold: the sweep
# stores season ranks, not squads. This is the job that turns entry ids into a
# portfolio, and it can only run after a deadline -- picks are private until one
# passes, and FPL serves them for the current season only. Nothing here can be
# backfilled, so the series starts at the first deadline of the season and
# accumulates forward.
#
# Runs often and costs almost nothing. The schedule below is every hour a
# deadline plausibly falls behind, and the first step reads the committed
# deadline list to ask "has one just passed". On a day when none has -- which is
# most days -- the job stops there, having made no requests at all.
#
# Deadlines are published by FPL and move, so they are read rather than assumed:
# `publish-deadlines` refreshes the list daily and this asks it.

on:
  schedule:
    # Deadlines land 90 minutes before the first kickoff. In practice that is
    # Friday evening, Saturday around 10:30 or 12:30, Sunday around 12:30, and
    # midweek rounds at 17:15. These are the hours after those, in UTC.
    - cron: "45 11,13,17,18 * * 5,6,0"
    - cron: "45 17,18 * * 2,3"
  workflow_dispatch:
    inputs:
      event:
        description: "Capture this gameweek regardless of the deadline list."
        required: false
        default: ""
        type: string
  # A change to this file is how a run gets asked for without a token.
  push:
    paths:
      - ".github/workflows/capture-fpl500.yml"

permissions:
  contents: write

concurrency:
  group: capture-fpl500
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip

      - name: Install engine
        run: python -m pip install -e .

      - name: Validate dispatch input
        env:
          EVENT: ${{ inputs.event }}
        run: |
          if [ -n "$EVENT" ] && ! printf '%s' "$EVENT" | grep -qE '^[0-9]{1,2}$'; then
            echo "event must be a gameweek number, got: $EVENT" >&2
            exit 1
          fi

      - name: Is there a deadline to capture
        id: due
        env:
          EVENT: ${{ inputs.event }}
        run: |
          if [ -n "$EVENT" ]; then
            echo "event=$EVENT" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Six hours behind the deadline: long enough that every manager has
          # been read even when FPL is slow, short enough that two scheduled
          # runs do not both claim the same gameweek.
          if event=$(python -m fpl_andres.cli.publish_deadlines --due-within 6); then
            echo "gameweek $event closed within the last six hours"
            echo "event=$event" >> "$GITHUB_OUTPUT"
          else
            echo "No deadline has passed recently. Nothing to capture."
          fi

      - name: Capture the cohort's picks
        if: steps.due.outputs.event != ''
        run: |
          set -o pipefail
          python -m fpl_andres.cli.capture_cohort_picks \
            --event "${{ steps.due.outputs.event }}" \
            | tee -a "$GITHUB_STEP_SUMMARY"
          python -m fpl_andres.cli.publish_fpl500 \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Annotate with realised points
        if: steps.due.outputs.event != ''
        run: |
          # Scores may not be published yet (DGW or early capture). A non-zero
          # exit is a soft failure: the portfolio is still valid without it.
          python -m fpl_andres.cli.annotate_portfolio \
            --event "${{ steps.due.outputs.event }}" \
            | tee -a "$GITHUB_STEP_SUMMARY" || \
            echo "FPL scores not yet available; sidecar skipped"

      - name: Commit the portfolio
        if: steps.due.outputs.event != ''
        run: |
          # The absence ledger travels with the portfolio. It is what the
          # ranking reads to give a place to somebody still playing, and a
          # capture that learned who answered and did not commit it has
          # learned nothing.
          paths="data/cohort/portfolio data/cohort/absent.json apps/web/src/data/fpl500.json"
          if [ ! -d data/cohort/portfolio ]; then
            echo "nothing new captured"
            exit 0
          fi
          npx --yes prettier@3 --write \
            data/cohort/portfolio/*.json \
            data/cohort/absent.json \
            apps/web/src/data/fpl500.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Staged first, then compared against the index. `git diff` does not
          # look at untracked files, and every capture here writes a new one, so
          # comparing the working tree would drop every one of them.
          git add $paths
          if git diff --cached --quiet -- $paths; then
            echo "nothing new captured"
            exit 0
          fi
          git commit -m "chore: capture the FPL500 for gameweek ${{ steps.due.outputs.event }}"
          git pull --rebase --autostash
          git push
