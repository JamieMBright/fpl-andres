name: Capture the FPL500

# What the cohort actually owns, once a gameweek.
#
# The catalogue knows who is good. It does not know what they hold: the sweep
# stores season ranks, not squads. This is the job that turns entry ids into a
# portfolio, and it can only run after a deadline -- picks are private until one
# passes, and FPL serves them for the current season only. Nothing here can be
# backfilled, so the series starts at the first deadline of the season and
# accumulates forward.
#
# Runs often and costs almost nothing. The schedule below is every hour a
# deadline plausibly falls behind, and the first step reads the committed
# deadline list to ask "has one just passed". On a day when none has -- which is
# most days -- the job stops there, having made no requests at all.
#
# Deadlines are published by FPL and move, so they are read rather than assumed:
# `publish-deadlines` refreshes the list daily and this asks it.

on:
  schedule:
    # Deadlines land 90 minutes before the first kickoff. In practice that is
    # Friday evening, Saturday around 10:30 or 12:30, Sunday around 12:30, and
    # midweek rounds at 17:15. These are the hours after those, in UTC.
    - cron: "45 11,13,17,18 * * 5,6,0"
    - cron: "45 17,18 * * 2,3"
  workflow_dispatch:
    inputs:
      event:
        description: "Capture this gameweek regardless of the deadline list."
        required: false
        default: ""
        type: string
  # A change to this file is how a run gets asked for without a token.
  push:
    paths:
      - ".github/workflows/capture-fpl500.yml"

permissions:
  contents: write

concurrency:
  group: capture-fpl500
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip

      - name: Install engine
        run: python -m pip install -e .

      - name: Validate dispatch input
        env:
          EVENT: ${{ inputs.event }}
        run: |
          if [ -n "$EVENT" ] && ! printf '%s' "$EVENT" | grep -qE '^[0-9]{1,2}$'; then
            echo "event must be a gameweek number, got: $EVENT" >&2
            exit 1
          fi

      - name: Is there a deadline to capture
        id: due
        env:
          EVENT: ${{ inputs.event }}
        run: |
          if [ -n "$EVENT" ]; then
            echo "event=$EVENT" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Six hours behind the deadline: long enough that every manager has
          # been read even when FPL is slow, short enough that two scheduled
          # runs do not both claim the same gameweek.
          if event=$(python -m fpl_andres.cli.publish_deadlines --due-within 6); then
            echo "gameweek $event closed within the last six hours"
            echo "event=$event" >> "$GITHUB_OUTPUT"
          else
            echo "No deadline has passed recently. Nothing to capture."
          fi

      - name: Pin and capture both cohort populations
        if: steps.due.outputs.event != ''
        run: |
          set -o pipefail
          event="${{ steps.due.outputs.event }}"
          membership="data/cohort/fpl500-membership/gw$(printf '%02d' "$event").json"
          catalogue="data/cohort/portfolio/gw$(printf '%02d' "$event").json"
          exact="data/cohort/portfolio/fpl500/gw$(printf '%02d' "$event").json"
          if [ ! -f "$membership" ]; then
            python -m fpl_andres.cli.pin_fpl500_membership \
              --event "$event" \
              --source-commit "$GITHUB_SHA" \
              | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          if [ ! -f "$catalogue" ]; then
            python -m fpl_andres.cli.capture_cohort_picks \
              --event "$event" \
              | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "$catalogue already exists; immutable capture retained"
          fi
          if [ ! -f "$exact" ]; then
            python -m fpl_andres.cli.capture_cohort_picks \
              --event "$event" \
              --membership "$membership" \
              --output-dir data/cohort/portfolio/fpl500 \
              | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "$exact already exists; immutable capture retained"
          fi
          bash scripts/republish-fpl500.sh

      - name: Commit the portfolio
        if: steps.due.outputs.event != ''
        run: |
          # The absence ledger travels with the portfolio. It is what the
          # ranking reads to give a place to somebody still playing, and a
          # capture that learned who answered and did not commit it has
          # learned nothing.
          paths="data/cohort/portfolio data/cohort/fpl500-membership data/cohort/absent.json data/cohort/fpl500.json apps/web/src/data/fpl500.json"
          if [ ! -d data/cohort/portfolio ]; then
            echo "nothing new captured"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          stage() {
            # The shared chain runs prettier over every JSON it publishes.
            bash scripts/republish-fpl500.sh
            git add $paths
          }
          stage
          if git diff --cached --quiet -- $paths; then
            echo "nothing new captured"
            exit 0
          fi
          git commit -m "chore: capture the FPL500 for gameweek ${{ steps.due.outputs.event }}"
          for attempt in 1 2 3 4 5; do
            git pull --rebase --autostash || git rebase --abort || true
            if git push; then
              exit 0
            fi
            echo "push rejected on attempt $attempt; rebuilding on the base that arrived"
            rm -rf "$RUNNER_TEMP/keep"
            mkdir -p "$RUNNER_TEMP/keep"
            cp -r data/cohort/portfolio "$RUNNER_TEMP/keep/portfolio"
            cp -r data/cohort/fpl500-membership "$RUNNER_TEMP/keep/fpl500-membership"
            cp data/cohort/absent.json "$RUNNER_TEMP/keep/absent.json"
            git fetch origin "$GITHUB_REF_NAME"
            git reset --hard "origin/$GITHUB_REF_NAME"
            mkdir -p data/cohort/portfolio data/cohort/fpl500-membership
            cp -r "$RUNNER_TEMP/keep/portfolio/." data/cohort/portfolio/
            cp -r "$RUNNER_TEMP/keep/fpl500-membership/." data/cohort/fpl500-membership/
            cp "$RUNNER_TEMP/keep/absent.json" data/cohort/absent.json
            stage
            if git diff --cached --quiet -- $paths; then
              echo "the base that arrived already carries this capture"
              exit 0
            fi
            git commit -m "chore: capture the FPL500 for gameweek ${{ steps.due.outputs.event }}"
          done
          echo "could not push the captured portfolios after five attempts" >&2
          exit 1
