name: Historical Ingest

# Manual dispatch only. Writes to the single hosted production project, so a run
# is deliberate: it names the exact archive commit it pins to.
#
# Defaults to every supported season in one click. The archive only publishes
# teams.csv and fixtures.csv from 2019-20 onward and the schema's foreign keys
# require both, so earlier seasons are refused rather than partially ingested.

on:
  workflow_dispatch:
    inputs:
      commit:
        description: "40-character vaastav archive commit SHA to pin to"
        required: true
        type: string
      seasons:
        description: "'all' for 2019-20..2025-26, or a comma-separated list"
        required: false
        default: "all"
        type: string
      gameweeks:
        description: "Gameweek selection, e.g. 1-47 or 1,2,7. Unpublished weeks are skipped."
        required: false
        default: "1-47"
        type: string
      data_available_at:
        description: "ISO-8601 UTC timestamp the revision became public (blank = now)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: historical-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: production
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip

      - name: Install engine
        run: python -m pip install -e .

      - name: Validate dispatch inputs
        # Checked before they reach shell array construction. A commit is a full
        # 40-character SHA because the archive is pinned, never a branch name.
        env:
          INGEST_COMMIT: ${{ inputs.commit }}
          INGEST_SEASONS: ${{ inputs.seasons }}
          INGEST_GAMEWEEKS: ${{ inputs.gameweeks }}
          INGEST_AVAILABLE_AT: ${{ inputs.data_available_at }}
        run: |
          if ! printf '%s' "$INGEST_COMMIT" | grep -qE '^[0-9a-f]{40}$'; then
            echo "commit must be a full 40-character SHA, got: $INGEST_COMMIT" >&2
            exit 1
          fi
          if ! printf '%s' "$INGEST_SEASONS" | grep -qE '^20[0-9]{2}-[0-9]{2}(,20[0-9]{2}-[0-9]{2})*$'; then
            echo "seasons must be a comma-separated list like 2023-24,2024-25" >&2
            exit 1
          fi
          if ! printf '%s' "$INGEST_GAMEWEEKS" | grep -qE '^[0-9]+(-[0-9]+)?$'; then
            echo "gameweeks must be N or N-M, got: $INGEST_GAMEWEEKS" >&2
            exit 1
          fi
          if [ -n "$INGEST_AVAILABLE_AT" ] && ! printf '%s' "$INGEST_AVAILABLE_AT" | grep -qE '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]+)?(Z|\+00:00)$'; then
            echo "data_available_at must be an ISO 8601 UTC timestamp" >&2
            exit 1
          fi

      - name: Ingest seasons
        timeout-minutes: 45
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          # Passed as env rather than inlined, so no input reaches the shell as code.
          INGEST_COMMIT: ${{ inputs.commit }}
          INGEST_SEASONS: ${{ inputs.seasons }}
          INGEST_GAMEWEEKS: ${{ inputs.gameweeks }}
          INGEST_AVAILABLE_AT: ${{ inputs.data_available_at }}
        run: |
          extra=()
          if [ -n "$INGEST_AVAILABLE_AT" ]; then
            extra+=(--data-available-at "$INGEST_AVAILABLE_AT")
          fi
          python -m fpl_andres.cli.ingest_historical \
            --commit "$INGEST_COMMIT" \
            --seasons "$INGEST_SEASONS" \
            --gameweeks "$INGEST_GAMEWEEKS" \
            "${extra[@]}"
