name: Historical Ingest

# Manual dispatch only. Writes to the single hosted production project, so a run
# is deliberate: it names the exact archive commit it pins to.

on:
  workflow_dispatch:
    inputs:
      season:
        description: "Archive season, e.g. 2024-25"
        required: true
        type: string
      commit:
        description: "40-character vaastav archive commit SHA to pin to"
        required: true
        type: string
      gameweeks:
        description: "Gameweek selection, e.g. 1-38 or 1,2,7"
        required: false
        default: "1-38"
        type: string
      data_available_at:
        description: "ISO-8601 UTC timestamp the revision became public (blank = now)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: historical-ingest-${{ inputs.season }}
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip

      - name: Install engine
        run: python -m pip install -e .

      - name: Ingest season
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          python -m fpl_andres.cli.ingest_historical \
            --season "${{ inputs.season }}" \
            --commit "${{ inputs.commit }}" \
            --gameweeks "${{ inputs.gameweeks }}" \
            ${{ inputs.data_available_at && format('--data-available-at "{0}"', inputs.data_available_at) || '' }}
