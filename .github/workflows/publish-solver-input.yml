name: Publish solver input

# Regenerate season-inputs.json whenever market data updates.
# Triggered by completed odds ingestions to ensure solver input is fresh
# with latest fixture odds and player props.

on:
  # FPL is the club-assignment authority. Transfers can land between odds or
  # live-capture runs, so rebuild once daily even when no upstream workflow has
  # changed; the commit step remains a no-op when the derived artifacts match.
  schedule:
    - cron: "0 3 * * *"
  push:
    paths: [".github/workflows/publish-solver-input.yml"]
  # Auto-trigger when market data or live data updates
  workflow_run:
    workflows:
      - "Ingest Bookmaker Odds"
      - "Ingest Player Odds"
      - "Capture settled gameweeks"
      - "Capture live current gameweek"
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-solver-input
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # The plan solve is the long part of the chain below, as it is in both odds
    # jobs. Twenty minutes was enough when this only rewrote the inputs.
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 20.20.2

      # republish-plan.sh builds the canonical fifteen through the workspace,
      # so pnpm has to exist before it runs.
      - name: Install JavaScript dependencies
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate
          pnpm install --frozen-lockfile

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip

      - name: Install engine
        run: python -m pip install -e .

      # Rewriting the inputs alone left the plan built on the previous ones:
      # the site kept serving a plan from before the market moved, and the
      # dependency-order check caught it as soon as the artifacts started
      # carrying honest timestamps rather than both being dated to the first
      # deadline. The whole derived chain is republished together, by the same
      # script the odds jobs call for the same reason.
      - name: Republish the derived planning chain
        run: |
          set -o pipefail
          bash scripts/republish-plan.sh | tee -a publish.log

      - name: Commit updated solver input
        run: |
          paths="apps/web/src/data/season-inputs.json apps/web/src/data/opening-squad.json apps/web/src/data/season-plan.json data/prospective"
          stage() {
            # shellcheck disable=SC2086
            git add $paths
          }
          rebuild() {
            bash scripts/republish-plan.sh
            stage
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          stage
          # Rebuilding twice is necessary if main moves underneath this job:
          # independently generated artifacts cannot be meaningfully rebased.
          if git diff --cached --quiet -- $paths; then
            echo "No changes to solver input"
            exit 0
          fi
          git commit -m "chore: regenerate solver input with fresh market data"
          for attempt in 1 2 3 4 5; do
            git pull --rebase --autostash || git rebase --abort || true
            if git push; then
              exit 0
            fi
            echo "push rejected on attempt $attempt; rebuilding on the base that arrived"
            git fetch origin "$GITHUB_REF_NAME"
            git reset --hard "origin/$GITHUB_REF_NAME"
            rebuild
            # shellcheck disable=SC2086
            if git diff --cached --quiet -- $paths; then
              echo "the base that arrived already carries this solver input"
              exit 0
            fi
            git commit -m "chore: regenerate solver input with fresh market data"
          done
          echo "could not push the regenerated solver input after five attempts" >&2
          exit 1
