name: Annotate the cohort portfolio

# What the cohort's holdings actually scored, once the round is over.
#
# This ran inside `capture-fpl500` and was wrong there. The capture fires
# within six hours of the deadline, which is roughly four hours after the first
# kickoff, and the live endpoint answers happily at that point with a scoreline
# that is still moving. The sidecar it wrote was mostly zeroes and was committed
# as a fact of record.
#
# So it runs here instead, daily and on its own. The command asks FPL whether
# every fixture in the round carries a confirmed score before it fetches
# anything, writes nothing until they do, and sweeps every captured week that
# is still missing a sidecar rather than only the newest. A round that ends on
# a Monday night is annotated on Tuesday morning; a round the capture missed
# entirely is picked up whenever it finishes.
#
# Separate from the capture so the two fail independently, for the same reason
# `score-cohort-agreement` is separate: an annotation that crashes must not
# take the portfolio commit with it.

on:
  # Bonus is confirmed within a couple of hours of the last match, and the
  # latest a Premier League round finishes is a Monday 20:00 kickoff. 06:00 UTC
  # is after that on every day of the week.
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      event:
        description: "Annotate this gameweek and report a refusal as an error."
        required: false
        default: ""
        type: string
  # A change to this file is how a run gets asked for without a token.
  push:
    paths:
      - ".github/workflows/annotate-portfolio.yml"

permissions:
  contents: write

concurrency:
  group: annotate-portfolio
  cancel-in-progress: false

jobs:
  annotate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip

      - name: Install engine
        run: python -m pip install -e .

      - name: Validate dispatch input
        env:
          EVENT: ${{ inputs.event }}
        run: |
          if [ -n "$EVENT" ] && ! printf '%s' "$EVENT" | grep -qE '^[0-9]{1,2}$'; then
            echo "event must be a gameweek number, got: $EVENT" >&2
            exit 1
          fi

      - name: Annotate with realised points
        id: annotate
        env:
          EVENT: ${{ inputs.event }}
        run: |
          set -o pipefail
          if [ -n "$EVENT" ]; then
            python -m fpl_andres.cli.annotate_portfolio --event "$EVENT" \
              | tee -a "$GITHUB_STEP_SUMMARY"
            python -m fpl_andres.cli.annotate_portfolio --event "$EVENT" \
              --portfolio-dir data/cohort/portfolio/fpl500 \
              | tee -a "$GITHUB_STEP_SUMMARY"
          else
            python -m fpl_andres.cli.annotate_portfolio \
              | tee -a "$GITHUB_STEP_SUMMARY"
            python -m fpl_andres.cli.annotate_portfolio \
              --portfolio-dir data/cohort/portfolio/fpl500 \
              | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          portfolio_dir="data/cohort/portfolio/fpl500"
          for aggregate in "$portfolio_dir"/gw??-aggregates.json; do
            [ -e "$aggregate" ] || continue
            event="$(basename "$aggregate" | sed -E 's/^gw([0-9]{2})-aggregates\.json$/\1/')"
            standing="$portfolio_dir/gw${event}-standing.json"
            [ ! -e "$standing" ] || continue
            if python -c 'import json,sys; raise SystemExit("seasonStanding" not in json.load(open(sys.argv[1], encoding="utf-8")))' "$aggregate"; then
              continue
            fi
            python -m fpl_andres.cli.capture_cohort_aggregate \
              --event "$((10#$event))" \
              --membership "data/cohort/fpl500-membership/gw${event}.json" \
              --portfolio-dir "$portfolio_dir" \
              --standing-output "$portfolio_dir/gw${event}-standing.json" \
              --standing-supersedes "gw${event}-aggregates.json" \
              --standing-correction-reason "adds-season-standing" \
              | tee -a "$GITHUB_STEP_SUMMARY"
          done
          for aggregate in "$portfolio_dir"/gw??-aggregates.json; do
            [ -e "$aggregate" ] || continue
            event="$(basename "$aggregate" | sed -E 's/^gw([0-9]{2})-aggregates\.json$/\1/')"
            if python -c 'import json,sys; raise SystemExit("hitsTaken" in json.load(open(sys.argv[1], encoding="utf-8")))' "$aggregate"; then
              continue
            fi
            refreshed="$RUNNER_TEMP/gw${event}-aggregates-refresh.json"
            refreshed_structure="$RUNNER_TEMP/gw${event}-structure-refresh.json"
            rm -f "$refreshed" "$refreshed_structure"
            python -m fpl_andres.cli.capture_cohort_aggregate \
              --event "$((10#$event))" \
              --membership "data/cohort/fpl500-membership/gw${event}.json" \
              --portfolio-dir "$portfolio_dir" \
              --output "$refreshed" \
              --structure-output "$refreshed_structure" \
              | tee -a "$GITHUB_STEP_SUMMARY"
            python - "$aggregate" "$refreshed" <<'PY'
          import json
          import sys
          from pathlib import Path

          target = Path(sys.argv[1])
          refreshed = Path(sys.argv[2])
          aggregate = json.loads(target.read_text(encoding="utf-8"))
          rebuilt = json.loads(refreshed.read_text(encoding="utf-8"))
          if "hitsTaken" not in rebuilt:
              raise SystemExit(f"refreshed aggregate missing hitsTaken: {refreshed}")
          aggregate["hitsTaken"] = int(rebuilt["hitsTaken"])
          if isinstance(aggregate.get("schemaVersion"), int) and aggregate["schemaVersion"] < 2:
              aggregate["schemaVersion"] = 2
          target.write_text(json.dumps(aggregate, indent=2) + "\n", encoding="utf-8")
          print(f"backfilled hitsTaken in {target}")
          PY
          done
          if [ -n "$(git status --porcelain --untracked-files=all -- data/cohort/portfolio)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      # The site reads the captains out of the FPL500 artifact, and a sidecar
      # nothing republishes against is a file the page never sees.
      - name: Republish the FPL500 artifact
        if: steps.annotate.outputs.changed == 'true'
        run: bash scripts/republish-fpl500.sh | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Commit the sidecars
        if: steps.annotate.outputs.changed == 'true'
        run: |
          paths="data/cohort/portfolio data/cohort/fpl500.json apps/web/src/data/fpl500.json"
          if [ ! -d data/cohort/portfolio ]; then
            echo "nothing captured yet"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          stage() {
            # The shared chain runs prettier over every JSON it publishes.
            bash scripts/republish-fpl500.sh
            git add $paths
          }
          stage
          if git diff --cached --quiet -- $paths; then
            echo "no round finished since the last run"
            exit 0
          fi
          git commit -m "chore: annotate the cohort portfolio with realised points"
          for attempt in 1 2 3 4 5; do
            git pull --rebase --autostash || git rebase --abort || true
            if git push; then
              exit 0
            fi
            echo "push rejected on attempt $attempt; rebuilding on the base that arrived"
            rm -rf "$RUNNER_TEMP/keep"
            mkdir -p "$RUNNER_TEMP/keep/portfolio"
            cp -r data/cohort/portfolio/. "$RUNNER_TEMP/keep/portfolio/"
            git fetch origin "$GITHUB_REF_NAME"
            git reset --hard "origin/$GITHUB_REF_NAME"
            mkdir -p data/cohort/portfolio
            cp -r "$RUNNER_TEMP/keep/portfolio/." data/cohort/portfolio/
            stage
            if git diff --cached --quiet -- $paths; then
              echo "the base that arrived already carries these sidecars"
              exit 0
            fi
            git commit -m "chore: annotate the cohort portfolio with realised points"
          done
          echo "could not push portfolio points after five attempts" >&2
          exit 1
