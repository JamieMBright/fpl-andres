name: Capture Crowd Signal

# Scheduled, not manual. The value of this table is the series: ownership before
# a deadline, after it, and how it moved in between. A snapshot taken only when
# someone remembers is worth very little.
#
# Reads the published aggregate only. Individual rival picks are a different
# endpoint with a different legality window and are not touched here.

on:
  schedule:
    # Thursday and Saturday mornings, plus Friday evening before a typical
    # deadline. Times are UTC and deliberately not on the hour.
    - cron: "17 9 * * 4"
    - cron: "17 17 * * 5"
    - cron: "17 9 * * 6"
  workflow_dispatch:
    inputs:
      season:
        description: "Season override, e.g. 2026-27. Blank derives it from the calendar."
        required: false
        default: ""
        type: string
      event:
        description: "Gameweek override. Blank uses the current or next event."
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: capture-crowd
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip

      - name: Install engine
        run: python -m pip install -e .

      - name: Validate dispatch inputs
        # Checked before they reach shell array construction. A season is
        # 2024-25 shaped; an event is 1..47, because 2019/20 ran to 47.
        env:
          CAPTURE_SEASON: ${{ inputs.season }}
          CAPTURE_EVENT: ${{ inputs.event }}
        run: |
          if [ -n "$CAPTURE_SEASON" ] && ! printf '%s' "$CAPTURE_SEASON" | grep -qE '^20[0-9]{2}-[0-9]{2}$'; then
            echo "season must look like 2024-25, got: $CAPTURE_SEASON" >&2
            exit 1
          fi
          if [ -n "$CAPTURE_EVENT" ]; then
            if ! printf '%s' "$CAPTURE_EVENT" | grep -qE '^[0-9]+$'; then
              echo "event must be a positive integer, got: $CAPTURE_EVENT" >&2
              exit 1
            fi
            if [ "$CAPTURE_EVENT" -lt 1 ] || [ "$CAPTURE_EVENT" -gt 47 ]; then
              echo "event must be between 1 and 47, got: $CAPTURE_EVENT" >&2
              exit 1
            fi
          fi

      - name: Capture crowd signal
        timeout-minutes: 15
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          # Passed as env rather than inlined, so no input reaches the shell as code.
          CAPTURE_SEASON: ${{ inputs.season }}
          CAPTURE_EVENT: ${{ inputs.event }}
        run: |
          extra=()
          if [ -n "$CAPTURE_SEASON" ]; then
            extra+=(--season "$CAPTURE_SEASON")
          fi
          if [ -n "$CAPTURE_EVENT" ]; then
            extra+=(--event "$CAPTURE_EVENT")
          fi
          python -m fpl_andres.cli.capture_crowd "${extra[@]}"
