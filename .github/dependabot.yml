version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/London
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - javascript
    groups:
      # Security patches travel alone and are never batched, so one is never
      # queued behind a major version bump waiting for review.
      security:
        applies-to: security-updates
        patterns:
          - "*"
      dev-dependencies:
        applies-to: version-updates
        dependency-type: development
      typescript-tooling:
        applies-to: version-updates
        patterns:
          - "typescript"
          - "@types/*"
          - "typescript-eslint"
          - "eslint*"
      react:
        applies-to: version-updates
        patterns:
          - "react"
          - "react-dom"
          - "react-router-dom"
          - "@types/react*"

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/London
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - python
    groups:
      security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/London
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    groups:
      security:
        applies-to: security-updates
        patterns:
          - "*"
      actions:
        applies-to: version-updates
        patterns:
          - "*"
