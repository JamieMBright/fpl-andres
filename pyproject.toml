[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "fpl-andres"
version = "0.5.0"
description = "Evidence-gated Fantasy Premier League analysis engine"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28,<1",
    "numpy>=2.2,<3",
    "pydantic>=2.12,<3",
    "scipy>=1.15,<2",
]

[project.optional-dependencies]
# Scraped advanced statistics. Optional because the core engine must build and
# test without a scraper, and because this pulls a native TLS library that has
# no business in the CI image.
scrape = [
    "soccerdata>=1.9,<2",
]
dev = [
    "hypothesis>=6.130,<7",
    "mypy>=1.15,<3",
    "pytest>=8.3,<10",
    "pytest-asyncio>=0.25,<2",
    "pytest-cov>=6,<8",
    "respx>=0.22,<1",
    "ruff>=0.11,<1",
    "scipy-stubs>=1.15,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["python/fpl_andres"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
asyncio_mode = "auto"
pythonpath = ["python"]
testpaths = ["python/tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["fpl_andres"]

[tool.mypy]
python_version = "3.12"
packages = ["fpl_andres"]
mypy_path = "python"
strict = true
warn_unreachable = true

# Ships no py.typed marker. Confined to one CLI, whose own boundary is typed.
[[tool.mypy.overrides]]
module = ["soccerdata.*"]
ignore_missing_imports = true
