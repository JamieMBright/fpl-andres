<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 200" role="img" aria-label="FPL Andres bucket mark">
  <!-- Silhouette traced from docs/design/inspiration/mask.png (Coleman-style drinks cooler / dugout bucket).
       Key shape facts (untracked reference stays in-repo but out of git):
       - Wider at the top than at the bottom (opposite of a plant pot).
       - Sides bulge OUTWARD subtly at mid-height (the "belly").
       - Slight arch on the top edge; rounded top and bottom corners.
       - Rounded bottom (mild convex arc, not a flat line).
       Uses currentColor so the design tokens set the bucket hue. -->
  <defs>
    <linearGradient id="bucketShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.18"/>
    </linearGradient>
  </defs>

  <!-- Cast shadow at the base -->
  <ellipse cx="130" cy="182" rx="86" ry="6" fill="#000" opacity="0.16"/>

  <!-- Bucket body -->
  <path d="
    M 62 24
    Q 130 18 198 24
    Q 212 24 212 38
    C 224 74 224 132 194 168
    Q 194 178 184 178
    Q 130 184 76 178
    Q 66 178 66 168
    C 36 132 36 74 48 38
    Q 48 24 62 24
    Z"
    fill="currentColor"/>

  <!-- Subtle shading for depth -->
  <path d="
    M 62 24
    Q 130 18 198 24
    Q 212 24 212 38
    C 224 74 224 132 194 168
    Q 194 178 184 178
    Q 130 184 76 178
    Q 66 178 66 168
    C 36 132 36 74 48 38
    Q 48 24 62 24
    Z"
    fill="url(#bucketShade)"/>

  <!-- Top-edge highlight (a hairline sheen on the lid arch) -->
  <path d="M 66 26 Q 130 20 194 26"
    fill="none" stroke="#fff" stroke-opacity="0.35" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Sponsor plate: fixed white background + fixed home-kit purple text
       so the wordmark stays readable on any bucket colour. -->
  <rect x="60" y="98" width="140" height="34" rx="3" fill="#f8f6ea"/>
  <rect x="60" y="98" width="140" height="34" rx="3" fill="none" stroke="#000" stroke-opacity="0.14" stroke-width="1"/>
  <text x="130" y="121"
    text-anchor="middle"
    font-family="'IBM Plex Mono', 'JetBrains Mono', ui-monospace, monospace"
    font-weight="700"
    font-size="17"
    letter-spacing="0.4"
    fill="#4a008e">@fpl_andres</text>
</svg>
