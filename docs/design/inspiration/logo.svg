<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 260 200"
  role="img"
  aria-label="FPL Andres — the bucket, @fpl_andres"
>
  <!--
    Attempt 2. Derived from docs/design/inspiration/bucket.webp — the Bielsa
    plastic drinks cooler. Truncated cone (wider at bottom than top), no
    handles, subtle base plinth, small dark top rim, sponsor plate positioned
    at ~55% height where the Wish sticker actually sat. Wordmark is
    @fpl_andres; the Leeds crest sticker is deliberately not carried over.
    currentColor drives the bucket body so design tokens set the hue.
  -->

  <!-- Base shadow -->
  <ellipse
    cx="130"
    cy="182"
    rx="112"
    ry="4"
    fill="var(--fa-surface-deep, #050a18)"
    opacity="0.28"
  />

  <!-- Bucket body: truncated cone -->
  <path
    d="M 68 32
       L 192 32
       L 232 172
       L 28 172
       Z"
    fill="currentColor"
    stroke="currentColor"
    stroke-width="2"
    stroke-linejoin="round"
  />

  <!-- Base plinth: subtle horizontal band suggesting the moulded bottom rim -->
  <rect
    x="28"
    y="164"
    width="204"
    height="8"
    fill="var(--fa-surface-deep, #050a18)"
    opacity="0.18"
  />

  <!-- Top rim: small dark ellipse showing the drinks-cooler opening -->
  <ellipse
    cx="130"
    cy="32"
    rx="62"
    ry="5"
    fill="var(--fa-surface-deep, #050a18)"
    opacity="0.5"
  />

  <!-- Sponsor plate: white sticker at ~55% height, replaces the Wish tag -->
  <rect
    x="52"
    y="100"
    width="156"
    height="36"
    rx="4"
    fill="#f8f6ea"
  />

  <!-- Wordmark: fixed purple so it reads on the fixed off-white plate,
       independent of the surrounding bucket / theme hue -->
  <text
    x="130"
    y="125"
    text-anchor="middle"
    font-family="'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace"
    font-size="19"
    font-weight="700"
    letter-spacing="-0.3"
    fill="#4a008e"
  >
    @fpl_andres
  </text>
</svg>
